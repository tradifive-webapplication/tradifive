name: Build Android App Bundle (.aab)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        working-directory: mobile-app
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        working-directory: mobile-app
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Copy Permanent Release Keystore
        working-directory: mobile-app
        run: |
          mkdir -p android/app
          cp tradifive-release.keystore android/app/tradifive-release.keystore

      - name: Build Android App Bundle (.aab)
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/tradifive-release.keystore \
            -Pandroid.injected.signing.store.password=tradifive2026 \
            -Pandroid.injected.signing.key.alias=tradifive \
            -Pandroid.injected.signing.key.password=tradifive2026 \
            --no-daemon

      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: TradiFive-Android-Release-AAB
          path: mobile-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
