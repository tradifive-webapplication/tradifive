<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft realistic drop shadow matching screenshot -->
    <filter id="cursorShadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="1.2" dy="2.8" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Top facet metallic graphite gradient -->
    <linearGradient id="topFacetGrad" x1="2" y1="2" x2="28" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525B" />
      <stop offset="35%" stop-color="#3F3F46" />
      <stop offset="75%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <!-- Bottom facet deep onyx / obsidian gradient -->
    <linearGradient id="bottomFacetGrad" x1="2" y1="2" x2="15" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="45%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- 3D Specular Ridge Highlight Line -->
    <linearGradient id="ridgeHighlight" x1="2" y1="2" x2="28" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#E4E4E7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#A1A1AA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3F3F46" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <g filter="url(#cursorShadow)">
    <!-- Base Body with smooth rounded tips -->
    <!-- Tip at (2.5, 2.5), Right Wing at (28.5, 13.5), Notch at (14, 14), Bottom Wing at (13.5, 28.5) -->
    
    <!-- Bottom Facet (Under diagonal) -->
    <path 
      d="M 2.5 2.5 L 14 14 L 13.5 27.5 C 13.2 28.8 11.7 29.3 10.9 28.4 L 2.0 4.2 C 1.6 3.2 2.1 2.3 2.5 2.5 Z" 
      fill="url(#bottomFacetGrad)" 
    />

    <!-- Top Facet (Above diagonal) -->
    <path 
      d="M 2.5 2.5 L 27.5 13.5 C 28.8 13.8 29.3 15.3 28.4 16.1 L 14 14 L 2.5 2.5 Z" 
      fill="url(#topFacetGrad)" 
    />

    <!-- Seamless Outer Silhouette Border -->
    <path 
      d="M 2.5 2.5 L 27.5 13.5 C 29.0 14.1 29.1 16.1 27.8 16.8 L 15.2 15.2 L 16.8 27.8 C 16.1 29.1 14.1 29.0 13.5 27.5 L 2.5 2.5 Z"
      fill="none"
      stroke="#000000"
      stroke-width="0.8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Specular Highlight Bevel along leading edge -->
    <path 
      d="M 3.2 3.0 L 26.5 13.2" 
      stroke="url(#ridgeHighlight)" 
      stroke-width="1.1" 
      stroke-linecap="round"
    />
  </g>
</svg>
